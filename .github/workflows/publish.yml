name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore
        run: dotnet restore
      

      - name: Build
        run: dotnet build --configuration Release --no-restore

      
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal


      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Pack
        run: |
          dotnet pack --configuration Release \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }} --no-build --output ./artifacts

      - name: Publish 


      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # your nuget.org username (profile name), NOT your email address
    
      # Push the package
      - name: NuGet push
        run: |
          dotnet nuget push "./artifacts/*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "./artifacts/*.snupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
